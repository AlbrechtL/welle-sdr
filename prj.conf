CONFIG_USB_DEVICE_STACK_NEXT=y

CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=y
CONFIG_SHELL_PROMPT_UART="welle-sdr:~$ "

CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_I2C=y
CONFIG_I2C_SHELL=y

# Enter every switched-in thread through mret: the PFIC keeps an interrupt
# active until the next mret and holds back all others meanwhile, so a thread
# resumed by a plain return would block the DVP block interrupt and the tick
# (README "CPU load and the kernel clock")
CONFIG_RISCV_ALWAYS_SWITCH_THROUGH_ECALL=y

# CPU load (src/cpu_load.c): thread switch hook only, no ISR hooks
CONFIG_TRACING=y
CONFIG_TRACING_USER=y
CONFIG_TRACING_ISR=n
